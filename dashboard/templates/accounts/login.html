{% block stylesheets %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Reset & Base */
:root {
  --primary: #2E7D32; /* Fern green */
  --primary-hover: #1B5E20;
  --bg-color: #F8FAFC;
  --card-bg: #FFFFFF;
  --text-main: #1E293B;
  --text-muted: #64748B;
  --border-color: #E2E8F0;
  --input-bg: #F8FAFC;
  --error: #EF4444;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Outfit', sans-serif;
  background-color: var(--bg-color);
  color: var(--text-main);
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

/* Card */
.login-card {
  background: var(--card-bg);
  width: 100%;
  max-width: 400px;
  padding: 2.5rem;
  border-radius: var(--radius);
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
  border: 1px solid rgba(226, 232, 240, 0.8);
}

/* Header */
.login-header {
  text-align: center;
  margin-bottom: 2rem;
}
.brand-logo {
  width: auto;
  height: 80px;
  margin-bottom: 1rem;
  object-fit: contain;
}
.login-title {
  font-family: 'Outfit', sans-serif;
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--text-main);
  margin-bottom: 0.5rem;
}
.login-subtitle {
  font-size: 0.875rem;
  color: var(--text-muted);
}

/* Form */
.login-form {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.form-label {
  font-size: 0.875rem;
  font-weight: 500;
  color: #334155;
}
.input-wrapper {
  position: relative;
}
.form-input {
  width: 100%;
  padding: 0.75rem 1rem;
  border-radius: 8px;
  border: 1px solid var(--border-color);
  background-color: var(--card-bg);
  font-size: 0.95rem;
  transition: all 0.2s ease;
  color: var(--text-main);
  font-family: inherit;
}
.form-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
}
.form-input::placeholder {
  color: #94A3B8;
}

/* Password Toggle */
.toggle-password {
  position: absolute;
  right: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: #94A3B8;
  padding: 0.25rem;
  display: flex;
  align-items: center;
}
.toggle-password:hover { color: var(--text-main); }

/* Error Message */
.error-msg {
  color: var(--error);
  font-size: 0.8rem;
  margin-top: 0.25rem;
  display: none;
}
.form-group.has-error .form-input { border-color: var(--error); }
.form-group.has-error .error-msg { display: block; }

/* Button */
.btn-submit {
  margin-top: 1rem;
  width: 100%;
  background-color: var(--primary);
  color: white;
  padding: 0.875rem;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.btn-submit:hover {
  background-color: var(--primary-hover);
}
.btn-submit:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}
.btn-loader {
  display: none;
  width: 20px;
  height: 20px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 0.8s linear infinite;
  position: absolute;
}
.btn-submit.loading .btn-text { visibility: hidden; }
.btn-submit.loading .btn-loader { display: block; }

@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.messages { width: 100%; margin-bottom: 1.25rem; }
.alert { padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.875rem; margin-bottom: 0.5rem; }
.alert-error, .alert-danger { background-color: #fca5a5; color: #7f1d1d; border: 1px solid #fecaca; }
.alert-success { background-color: #86efac; color: #14532d; border: 1px solid #bbf7d0; }
.alert-info { background-color: #bae6fd; color: #0c4a6e; border: 1px solid #e0f2fe; }
.alert-warning { background-color: #fde047; color: #713f12; border: 1px solid #fef08a; }

</style>
{% endblock stylesheets %}

{% block content %}
<div class="login-card">
  <div class="login-header">
    <img src="/static/assets/img/brand/uploaded_logo.png" alt="Fernrie Logo" class="brand-logo">
    <h1 class="login-title">Fernrie</h1>
    <p class="login-subtitle">Sign in to your dashboard</p>
  </div>

  {% if messages %}
    <div class="messages">
      {% for message in messages %}
         <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}

  <form method="POST" class="login-form" autocomplete="off" novalidate>
    {% csrf_token %}
    
    <div class="form-group" id="group-email">
      <label for="email" class="form-label">Email Address</label>
      <input type="email" id="email" name="email" class="form-input" placeholder="admin@fernrie.com" required>
      <div class="error-msg" id="error-email">Please enter a valid email.</div>
    </div>

    <div class="form-group" id="group-password">
      <label for="password" class="form-label">Password</label>
      <div class="input-wrapper">
        <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
        <button type="button" class="toggle-password" onclick="togglePassword(this)">
            <!-- Simple Eye Icon (SVG) -->
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-open"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-closed" style="display:none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
        </button>
      </div>
      <div class="error-msg" id="error-password">Password is required.</div>
    </div>

    <button type="submit" class="btn-submit" id="login-btn">
      <span class="btn-text">Sign In</span>
      <span class="btn-loader"></span>
    </button>
  </form>
</div>

<script>
function togglePassword(btn) {
  const input = btn.previousElementSibling;
  const eyeOpen = btn.querySelector('.eye-open');
  const eyeClosed = btn.querySelector('.eye-closed');
  
  if (input.type === "password") {
    input.type = "text";
    eyeOpen.style.display = 'none';
    eyeClosed.style.display = 'block';
  } else {
    input.type = "password";
    eyeOpen.style.display = 'block';
    eyeClosed.style.display = 'none';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const form = document.querySelector('.login-form');
  const loginBtn = document.getElementById('login-btn');
  const emailInput = document.getElementById('email');
  const passInput = document.getElementById('password');

  // Simple validation helpers
  const setError = (id, msg) => {
    const group = document.getElementById('group-' + id);
    const errObj = document.getElementById('error-' + id);
    group.classList.add('has-error');
    if(msg) errObj.innerText = msg;
  };
  const clearError = (id) => {
    document.getElementById('group-' + id).classList.remove('has-error');
  };

  [emailInput, passInput].forEach(inp => {
    inp.addEventListener('input', () => clearError(inp.id));
  });

  form.addEventListener('submit', (e) => {
    let valid = true;
    
    // Email Check
    if(!emailInput.value.trim() || !/^\S+@\S+\.\S+$/.test(emailInput.value)) {
       setError('email', 'Please enter a valid email address.');
       valid = false;
    }
    // Password Check
    if(!passInput.value) {
       setError('password', 'Password is required.');
       valid = false;
    }

    if(!valid) {
      e.preventDefault();
      return;
    }

    // Simulate loading for better UX
    loginBtn.classList.add('loading');
    // Allow submission
  });
});
</script>
{% endblock content %}
